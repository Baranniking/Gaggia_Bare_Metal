; Gaggia Bare Metal — UI firmware for WT32-SC01 Plus
;
;   pio run -e demo -t upload       hardware + built-in machine simulator (default)
;   pio run -e release -t upload    hardware, real STM32 link (GAGGIA_SIM=0)
;   pio run -e demo_arduino2        fallback: official platform, Arduino core 2.0.x
;   pio run -e native_sim           PC build of the UI, dumps screenshots (see sim/)
;   pio device monitor              USB serial: '#' event log + telemetry CSV

[platformio]
default_envs = demo
boards_dir   = boards

; ---------------------------------------------------------------- shared
[common]
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I src
    -I src/ui
    -I src/app
    -I src/proto
lib_deps_lvgl =
    lvgl/lvgl@8.4.0

; ---------------------------------------------------------------- ESP32-S3
; pioarduino = Arduino core 3.3.x / ESP-IDF 5.5. Every package it needs comes
; from GitHub releases. Pinned: bump the version on purpose, not by accident.
[esp32_base]
platform          = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board             = wt32-sc01-plus-8mb
framework         = arduino
monitor_speed     = 115200
monitor_filters   = esp32_exception_decoder, time
upload_speed      = 921600
board_build.filesystem = littlefs
build_flags =
    ${common.build_flags}
    -DCORE_DEBUG_LEVEL=1
    -Wall
    -Wno-unused-parameter
    -Wno-missing-field-initializers
build_src_filter  = +<*> -<sim/>
lib_deps =
    ${common.lib_deps_lvgl}
    lovyan03/LovyanGFX@^1.2.33           ; >= 1.2.2x needed for ESP-IDF 5.5

[env:demo]
extends     = esp32_base
build_flags = ${esp32_base.build_flags} -DGAGGIA_SIM=1

[env:release]
extends     = esp32_base
build_type  = release
build_flags = ${esp32_base.build_flags} -DGAGGIA_SIM=0 -O2

[env:debug]
; JTAG over the S3's built-in USB (esp-builtin)
extends     = esp32_base
build_type  = debug
build_flags = ${esp32_base.build_flags} -DGAGGIA_SIM=1 -DCORE_DEBUG_LEVEL=4
debug_tool  = esp-builtin

[env:demo_arduino2]
; Official PlatformIO platform, Arduino core 2.0.17 (ESP-IDF 4.4).
; Kept as a fallback; not the tested configuration.
extends     = esp32_base
platform    = espressif32@6.9.0
build_flags = ${esp32_base.build_flags} -DGAGGIA_SIM=1

; ---------------------------------------------------------------- PC
[env:native_sim]
; Headless PC build: real UI + model simulator, scripted touches,
; writes RGB565 frames + serial.log into ./sim_out (see sim/pc_main.c)
platform         = native
build_flags      = ${common.build_flags} -I sim -DGAGGIA_SIM=1 -lm
build_src_filter = +<ui/> +<app/> +<proto/> +<../sim/> -<../sim/test_proto.c> -<../sim/test_link.c>
lib_deps         = ${common.lib_deps_lvgl}
lib_compat_mode  = off
